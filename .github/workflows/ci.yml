# Gate every push to main and every PR on typecheck + tests + build.
# This is the check the Azure deploy workflow does NOT do — it exists so a
# broken build (e.g. a type error) cannot reach production unnoticed.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Blocking: lint debt is cleared (0 errors). eslint exits non-zero on any
      # error-level rule, so new errors now fail CI. Warnings (e.g. the
      # documented set-state-in-effect cases) are reported but do not block.
      - name: Lint
        run: npm run lint
