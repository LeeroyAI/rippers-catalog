# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - rippers-mtb-au

on:
  # Deploy only after the CI workflow (typecheck + tests + build + lint) passes
  # on main. Manual runs via the Actions tab are always allowed.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

# Serialize deploys. Two overlapping `az webapp deploy` runs restart the SCM
# container out from under each other ("Deployment has been stopped due to SCM
# container restart"). Queue, never cancel mid-deploy.
concurrency:
  group: azure-deploy-rippers-mtb-au
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build the self-contained server bundle HERE (Linux x64 runner, plenty of
      # RAM + correct native binaries). The B1 App Service instance cannot run
      # `next build` (OOM), so we never build on Azure.
      - name: Build standalone bundle
        run: npm run build

      # Assemble the deploy root. `next build` puts the traced server +
      # node_modules in .next/standalone, but NOT the static assets or /public,
      # so copy those in alongside server.js.
      - name: Assemble standalone deploy directory
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          ( cd deploy && zip -r -q /tmp/app.zip . )
          ls -lh /tmp/app.zip

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: /tmp/app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_988D18DAEB0A46AB901C334E297A85AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5DF74410192B4D7FABEA47A5D4773535 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7C9B3CC268574CD99B1DD5B597664741 }}

      - name: Configure App Service to RUN the prebuilt bundle (no Oryx build)
        run: |
          # The zip is already built. Tell Kudu NOT to build (no npm install /
          # next build on the B1 box), and start the Next standalone server.
          az webapp config appsettings set -g rippers-rg -n rippers-mtb-au \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false 1>/dev/null
          az webapp config appsettings delete -g rippers-rg -n rippers-mtb-au \
            --setting-names WEBSITES_PORT 1>/dev/null 2>&1 || true
          az webapp config set -g rippers-rg -n rippers-mtb-au \
            --startup-file "node server.js" --linux-fx-version "NODE|22-lts" 1>/dev/null

      - name: Stop the app so --clean can fully wipe wwwroot
        run: |
          # A running container locks node_modules and any leftover
          # node_modules.tar.gz, so OneDeploy's --clean silently skips them and
          # stale files survive. A stale node_modules.tar.gz is fatal: the
          # appsvc Node image extracts it over the real node_modules on boot,
          # so `node server.js` exits 1. Stop first => nothing locked => clean.
          az webapp stop -g rippers-rg -n rippers-mtb-au 1>/dev/null
          sleep 5

      - name: Deploy (clean) to Azure Web App
        run: |
          # The app is stopped, so OneDeploy's --clean fully wipes wwwroot. The
          # file copy completes server-side in 1-2 min, but the CLI then blocks
          # waiting for the STOPPED site to start (it never will until the next
          # step), so bound it with `timeout` and tolerate the non-zero exit.
          # The next step confirms the deployment actually reached status 4.
          timeout 240 az webapp deploy -g rippers-rg -n rippers-mtb-au \
            --src-path app.zip --type zip --clean true --restart false \
            --track-status false 1>/dev/null 2>&1 || true

      - name: Confirm deployment succeeded server-side
        run: |
          for i in $(seq 1 24); do
            st=$(az rest --method GET \
              --url "https://rippers-mtb-au.scm.azurewebsites.net/api/deployments?\$top=1" \
              --resource "https://management.azure.com" \
              --query "[0].status" -o tsv 2>/dev/null || echo "")
            echo "deployment status: ${st:-?} (4=success, 3=failed)"
            [ "$st" = "4" ] && exit 0
            [ "$st" = "3" ] && { echo "deployment failed"; exit 1; }
            sleep 10
          done
          echo "timed out waiting for deployment to finish"; exit 1

      - name: Start the app
        run: az webapp start -g rippers-rg -n rippers-mtb-au 1>/dev/null

      - name: Verify the live site is serving the new build
        run: |
          # Check a SERVER-rendered marker. The hero headline is client-rendered
          # so curl never sees it; the <title> is in the SSR HTML head.
          for i in $(seq 1 18); do
            sleep 15
            code=$(curl -s -o /tmp/body.html -w '%{http_code}' --max-time 20 \
              "https://rippers-mtb-au.azurewebsites.net/" -H "Cookie: rippers_onboarded=1" -L || true)
            if [ "$code" = "200" ] && grep -q "Rippers App" /tmp/body.html; then
              echo "SUCCESS: live site is up (HTTP 200, app shell served)."; exit 0
            fi
            echo "attempt $i: HTTP $code, not ready yet..."
          done
          echo "FAILED: live site did not come up after deploy."; exit 1

      - name: Show container log (on failure)
        if: failure()
        run: |
          az webapp log download -g rippers-rg -n rippers-mtb-au --log-file /tmp/logs.zip 1>/dev/null 2>&1 || true
          mkdir -p /tmp/logs && unzip -o /tmp/logs.zip -d /tmp/logs 1>/dev/null 2>&1 || true
          echo "===== CONTAINER LOG (last 120 lines) ====="
          ( find /tmp/logs -name '*.log' -exec cat {} + 2>/dev/null ) | tail -120 || echo "(no logs retrieved)"
