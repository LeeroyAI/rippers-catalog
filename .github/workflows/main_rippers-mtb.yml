# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - rippers-mtb

on:
  # Deploy only after the CI workflow (typecheck + tests + build + lint) passes
  # on main. Manual runs via the Actions tab are always allowed.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Ship the SOURCE (no node_modules / .next). Azure's own build system
      # (Oryx) runs `npm install` + `npm run build`, then starts the app with
      # `next start`, which binds 0.0.0.0:$PORT correctly. This is the
      # platform-native path and avoids the Next "standalone" server's Azure
      # startup problems (HOSTNAME binding, exit-code-1 on boot).
      - name: Package source for Oryx build
        run: zip -r -q /tmp/src.zip . -x '*.git*' 'node_modules/*' '.next/*'

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: src
          path: /tmp/src.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: src

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_988D18DAEB0A46AB901C334E297A85AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5DF74410192B4D7FABEA47A5D4773535 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7C9B3CC268574CD99B1DD5B597664741 }}

      - name: Configure App Service to build with Oryx and start Next
        run: |
          # Azure builds the deployed source (npm install + next build) and runs
          # `npm start` (= next start). Clear the standalone-era custom startup
          # and the non-standard port so the platform uses its defaults.
          az webapp config appsettings set -g rippers-rg -n rippers-mtb \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true 1>/dev/null
          az webapp config appsettings delete -g rippers-rg -n rippers-mtb \
            --setting-names WEBSITES_PORT 1>/dev/null 2>&1 || true
          az webapp config set -g rippers-rg -n rippers-mtb \
            --startup-file "npm run start" --linux-fx-version "NODE|22-lts" 1>/dev/null

      - name: Deploy (clean) to Azure Web App
        run: |
          az webapp deploy -g rippers-rg -n rippers-mtb \
            --src-path src.zip --type zip --clean true --restart true 1>/dev/null

      - name: Verify the live site flipped to the new build
        run: |
          for i in $(seq 1 18); do
            sleep 20
            body=$(curl -s --max-time 20 "https://rippers-mtb.azurewebsites.net/" -H "Cookie: rippers_onboarded=1" -L || true)
            if echo "$body" | grep -q "Find the right MTB"; then
              echo "SUCCESS: live site is serving the new build."; exit 0
            fi
            echo "attempt $i: not flipped yet..."
          done
          echo "FAILED: live site did not flip after deploy."; exit 1

      - name: Show container startup log (on failure)
        if: failure()
        run: |
          az webapp log download -g rippers-rg -n rippers-mtb --log-file /tmp/logs.zip 1>/dev/null 2>&1 || true
          mkdir -p /tmp/logs && unzip -o /tmp/logs.zip -d /tmp/logs 1>/dev/null 2>&1 || true
          echo "===== CONTAINER / BUILD LOG (last 120 lines) ====="
          ( find /tmp/logs -name '*.log' -exec cat {} + 2>/dev/null ) | tail -120 || echo "(no logs retrieved)"
