# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - rippers-mtb

on:
  # Deploy only after the CI workflow (typecheck + tests + build + lint) passes
  # on main. Manual runs via the Actions tab are always allowed.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Gate: run only when CI succeeded on main, or on a manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Produces the self-contained server at .next/standalone/server.js.
      - name: Build (Next standalone)
        run: npm run build

      # Standalone does not include static assets or /public; copy them in so the
      # deployed bundle is complete and runs with `node server.js`.
      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi

      - name: Upload standalone bundle for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download standalone bundle from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_988D18DAEB0A46AB901C334E297A85AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5DF74410192B4D7FABEA47A5D4773535 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7C9B3CC268574CD99B1DD5B597664741 }}

      # We ship a fully built bundle, so the host must NOT try to rebuild, and the
      # startup command must launch the standalone server. If the deploy principal
      # lacks rights for these, this step fails before any deploy — the live app is
      # left untouched — and the startup command can be set once in the portal:
      # Configuration > General settings > Startup Command: node server.js
      - name: Configure App Service for the prebuilt standalone bundle
        run: |
          # Force everything onto port 8080 so there is no probe/listen mismatch:
          # Azure probes WEBSITES_PORT (8080) and the standalone listens on
          # 0.0.0.0:8080. HOSTNAME must be 0.0.0.0 or Next binds to the container
          # name and the probe times out.
          az webapp config appsettings set -g rippers-rg -n rippers-mtb \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false WEBSITES_PORT=8080 1>/dev/null
          az webapp config set -g rippers-rg -n rippers-mtb \
            --startup-file "HOSTNAME=0.0.0.0 PORT=8080 node server.js" --linux-fx-version "NODE|22-lts" 1>/dev/null
          echo "Startup command is now: $(az webapp config show -g rippers-rg -n rippers-mtb --query appCommandLine -o tsv)"

      # Root cause: the default (incremental) deploy left the OLD build's files
      # in /home/site/wwwroot, so the app kept running the old server.js. Package
      # the bundle and deploy with --clean, which WIPES wwwroot first so only the
      # new build remains, then restarts.
      - name: Package the standalone bundle
        run: cd "$GITHUB_WORKSPACE" && zip -r -q /tmp/app.zip . -x '*.git*'

      - name: Deploy (clean) to Azure Web App
        run: |
          az webapp deploy -g rippers-rg -n rippers-mtb \
            --src-path /tmp/app.zip --type zip --clean true --restart true 1>/dev/null

      # Prove it worked: the home page (public) must now serve the new build.
      # Fails the job if the live site is still the old build.
      - name: Verify the live site flipped to the new build
        run: |
          for i in $(seq 1 12); do
            sleep 15
            body=$(curl -s --max-time 20 "https://rippers-mtb.azurewebsites.net/" -H "Cookie: rippers_onboarded=1" -L || true)
            if echo "$body" | grep -q "Find the right MTB"; then
              echo "SUCCESS: live site is serving the new build."; exit 0
            fi
            echo "attempt $i: not flipped yet..."
          done
          echo "FAILED: live site did not flip to the new build after deploy."; exit 1

      # If anything above failed (e.g. the container would not boot), print the
      # actual container startup log so we stop guessing about the cause.
      - name: Show container startup log (on failure)
        if: failure()
        run: |
          az webapp log download -g rippers-rg -n rippers-mtb --log-file /tmp/logs.zip 1>/dev/null 2>&1 || true
          mkdir -p /tmp/logs && unzip -o /tmp/logs.zip -d /tmp/logs 1>/dev/null 2>&1 || true
          echo "===== CONTAINER STARTUP LOG (last 80 lines) ====="
          ( cat /tmp/logs/LogFiles/*docker*.log 2>/dev/null || find /tmp/logs -name '*.log' -exec cat {} + 2>/dev/null ) | tail -80 || echo "(no logs retrieved)"
